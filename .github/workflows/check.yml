name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Schema checker for the schema tests
        run: python3 -m pip install --quiet 'jsonschema==4.23.0'
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      - name: Gate removals are caught
        run: python3 scripts/mutation_check.py
      - name: Kit integrity
        run: python3 scripts/check_kit.py
